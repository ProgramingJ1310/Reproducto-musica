
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ♡</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <main class="reproductor">

        <!-- Barra superior -->
        <header class="barra-titulo">
            <span>♥ Para ti...</span>
            <span class="boton-cerrar">×</span>
        </header>

        <!-- Contenido principal -->
        <section class="contenido">

            <!-- CD pixelado -->
            <div class="zona-cd">
                <img
                    src="assets/cd.png"
                    alt="CD pixelado"
                    class="cd-pixel"
                >
            </div>

           
<div class="informacion-cancion">
    <h1 id="titulo-cancion">Una canción para ti ♡</h1>
    <p id="subtitulo-cancion">Con todo mi cariño...</p>

    <div id="revelacion-cancion" class="revelacion-cancion">
        Don't Leave Me ♡
    </div>
</div>


            <!-- Botón de reproducción -->
            <div class="controles">
                <button
                    id="boton-play"
                    class="boton-musical"
                    type="button"
                    aria-label="Reproducir canción"
                >
                    <img
                        id="icono-play"
                        src="assets/play.png"
                        alt="Reproducir"
                    >
                </button>
            </div>

            <!-- Barra de progreso -->
            <div class="progreso-musica">

                <span id="tiempo-actual">0:00</span>

                <input
                    type="range"
                    id="barra-progreso"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Progreso de la canción"
                >

                <span id="duracion-musica">0:00</span>

            </div>

            <!-- Traducción de la canción -->
            <section class="letra">
                <h2>♫ Don't Leave Me ♫</h2>

             

                <p id="texto-letra">
                    Pulsa play y disfruta la canción conmigo...
                </p>
            </section>

        </section>

        <!-- Pie de página -->
        <footer class="pie">
            ♡ Siempre tú ♡
        </footer>

    </main>

    <!-- Archivo de audio -->
    <audio
        id="audio-cancion"
        src="audio/dont-leave-me.mp3"
        preload="metadata"
    ></audio>

</body>

</html>
