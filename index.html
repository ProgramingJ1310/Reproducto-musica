<script>
const muneco = document.getElementById("muneco-bts");

if (muneco) {
    setInterval(() => {
        const esNormal = muneco.getAttribute("src").endsWith("muneco-bts.png");

        muneco.setAttribute(
            "src",
            esNormal
                ? "assets/muneco-bts-saludando.png"
                : "assets/muneco-bts.png"
        );
    }, 1000);
}
</script>
